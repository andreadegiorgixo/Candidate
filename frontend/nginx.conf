server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Upload CV fino a 5 MB (vedi spring.servlet.multipart.*)
    client_max_body_size 10m;

    # Stesso ruolo di proxy.conf.json in sviluppo: /api va al backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # File con hash nel nome: cache lunga
    location ~* \.(?:js|css|woff2?|png|jpe?g|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Routing lato client di Angular
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
