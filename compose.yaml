services:
  postgres:
    image: postgres:18-alpine
    container_name: candidate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Europe/Rome
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - candidate-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backend e frontend stanno nel profilo "app": Spring Boot in sviluppo
  # (spring.docker.compose) avvia solo Postgres; per avviare tutto:
  #   docker compose --profile app up -d --build
  backend:
    profiles: [app]
    build: ./backend
    image: candidate-backend
    container_name: candidate-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      TZ: Europe/Rome
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"

  frontend:
    profiles: [app]
    build: ./frontend
    image: candidate-frontend
    container_name: candidate-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4200}:80"

volumes:
  candidate-pgdata:
