# ===== Applicazione =====
spring.application.name=candidate
spring.config.import=optional:file:../.env[.properties]
spring.threads.virtual.enabled=true

# ===== Server =====
server.port=8080

# ===== Upload (CV: massimo 5 MB per file) =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ===== Docker Compose (sviluppo) =====
spring.docker.compose.file=../compose.yaml
spring.docker.compose.lifecycle-management=start-only

# ===== Datasource (valori dal .env) =====
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# ===== JPA / Hibernate =====
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===== Flyway =====
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# ===== Swagger / OpenAPI =====
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ===== Logging =====
logging.level.com.candidate=DEBUG

# ===== Candidate: sicurezza =====
candidate.security.jwt.secret=${JWT_SECRET}
candidate.security.jwt.expiration=8h
candidate.cors.allowed-origins=http://localhost:4200
